<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ecologies of Care, Substack strip</title>
<link rel="stylesheet" href="https://use.typekit.net/kpw6kkh.css">
<style>
  /* Strip of Substack posts at the bottom of the ecologiesofcare.net homepage.
     It repeats the header: a faint dark veil over the backdrop, white Hoss Round,
     20px side margins. Cargo sizes its type by the window height, so the strip needs to
     know how tall the iframe is in Cargo (23vh). Change --share, or add ?vh=NN to the
     iframe address, whenever that height changes. */
  :root {
    --share: 23;                                       /* iframe height in Cargo, in vh */
    --pvh: calc(100vh / var(--share));                 /* 1vh of the main page */
    --text: clamp(11px, min(calc(var(--pvh) * 1.368), 1.536vw), 16px);   /* header text size */
    --band: rgba(0, 0, 0, 0.07);                       /* header background */
    --paper: #FDFDFD;
    --paper-soft: rgba(253, 253, 253, 0.68);
    --ink: #000000;
    --chip: rgba(0, 0, 0, 0.3);
    --veil: rgba(0, 0, 0, 0.4);
    --tint: rgba(253, 253, 253, 0.12);
    --logo-ground: #354934;                            /* background of the Substack logo image */
    --edge: 20px;                                      /* header side margin */
    --top: 12px;
    --gap: 12px;
    --sans: "hoss-round", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (max-width: 600px) {
    :root { --edge: 12px; --top: 10px; --gap: 8px; }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: var(--sans);
    font-size: var(--text);
    line-height: 1.2;
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  [hidden] { display: none !important; }

  .strip {
    display: flex;
    gap: var(--gap);
    height: 100%;
    padding: var(--top) var(--edge) var(--edge);
    background: var(--band);
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .strip::-webkit-scrollbar { display: none; }
  .strip.is-dragging { cursor: grabbing; }

  .card {
    --cap: calc(3.6em + 6px);                          /* three lines of caption */
    position: relative;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    height: 100%;
    width: calc((100vh - var(--top) - var(--edge) - var(--cap)) * 4 / 3);
  }

  .media { position: relative; flex: 1 1 auto; overflow: hidden; background: var(--tint); }
  .media img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: none;
    transition: opacity 0.25s ease;
  }
  .card:hover .media img { opacity: 0.9; }
  /* Posts without their own image show the project logo at half size, on its own green. */
  .media--logo { background: var(--logo-ground); }
  .media--logo img {
    inset: auto;
    left: 50%;
    top: 50%;
    width: auto;
    height: 50%;
    object-fit: contain;
    transform: translate(-50%, -50%);
  }
  .media-text {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;
    font-size: 1.15em;
    line-height: 1.2;
    text-wrap: balance;
  }
  .media-text b { font-weight: 700; }

  .label {
    position: absolute;
    top: 8px;
    z-index: 3;
    padding: 0.2em 0.45em 0.25em;
    font: inherit;
    font-size: 0.85em;
    line-height: 1.2;
    color: var(--paper);
    background: var(--chip);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .label--left { left: 8px; }
  .label--right { right: 8px; border: 0; cursor: pointer; }
  .label--right:hover,
  .card.is-open .label--right { background: var(--paper); color: var(--ink); }
  .label--right:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

  .cap { height: var(--cap); padding-top: 6px; }
  .cap > * { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: inherit; }
  .cap .meta { color: var(--paper-soft); font-variant-numeric: tabular-nums; }

  /* The title link stretches over the whole card, so any click opens the article. */
  .title a::after { content: ""; position: absolute; inset: 0; z-index: 2; }
  .title a:focus-visible { outline: none; }
  .title a:focus-visible::after { outline: 2px solid var(--paper); outline-offset: 2px; }
  .card:hover .title a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.15em; }

  .veil {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 0.5em;
    padding: calc(8px + 2em) 10px 10px;
    background: var(--veil);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s;
  }
  .card.is-open .veil { opacity: 1; visibility: visible; }
  .veil-title {
    font-weight: 700;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
  }
  .veil-text {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 6;
  }
  .veil-go { font-size: 0.85em; color: var(--paper-soft); }

  @media (prefers-reduced-motion: reduce) {
    .veil, .media img { transition: none; }
  }
</style>
</head>
<body>
<section class="strip" id="strip" aria-label="Latest posts from the Ecologies of Care Substack" hidden></section>

<script>
(() => {
  const NEW_DAYS = 30;     // posts younger than this many days get the "New" label
  const MAX_CARDS = 12;
  const ARCHIVE_URL = 'https://ecologiesofcare.substack.com/archive';
  const strip = document.getElementById('strip');

  // ?vh=NN in the iframe address overrides --share (the iframe height in Cargo, in vh).
  const share = Number(new URLSearchParams(location.search).get('vh'));
  if (share > 0 && share <= 100) document.documentElement.style.setProperty('--share', String(share));
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };
  const isHttps = url => typeof url === 'string' && url.startsWith('https://');
  const pad = n => String(n).padStart(2, '0');
  const formatDate = iso => {
    const d = new Date(iso);
    return isNaN(d) ? '' : `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
  };
  const isNew = iso => (Date.now() - new Date(iso).getTime()) / 864e5 <= NEW_DAYS;

  function caption(title, url, lines) {
    const cap = el('div', 'cap');
    const heading = el('h2', 'title');
    const link = el('a', null, title);
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener';
    heading.appendChild(link);
    cap.appendChild(heading);
    lines.forEach(node => cap.appendChild(node));
    return cap;
  }

  function closeAll(except) {
    strip.querySelectorAll('.card.is-open').forEach(card => {
      if (card === except) return;
      card.classList.remove('is-open');
      const btn = card.querySelector('.label--right');
      btn.setAttribute('aria-expanded', 'false');
      btn.textContent = 'Info';
    });
  }

  function postCard(post, index) {
    const card = el('article', 'card');
    const media = el('div', 'media');
    if (post.logo) media.classList.add('media--logo');

    const showTitleInstead = () => {
      media.querySelector('img')?.remove();
      if (!media.querySelector('.media-text')) media.appendChild(el('span', 'media-text', post.title));
    };

    if (isHttps(post.image)) {
      const img = el('img');
      img.alt = '';
      img.decoding = 'async';
      img.loading = index < 6 ? 'eager' : 'lazy';
      img.draggable = false;
      img.addEventListener('error', () => {
        if (isHttps(post.imageOriginal) && img.src !== post.imageOriginal) img.src = post.imageOriginal;
        else showTitleInstead();
      });
      img.src = post.image;
      media.appendChild(img);
    } else {
      showTitleInstead();
    }

    const kind = post.type === 'podcast' ? 'Podcast' : 'Article';
    media.appendChild(el('span', 'label label--left', isNew(post.date) ? 'New' : kind));

    const veilId = `veil-${index}`;
    const info = el('button', 'label label--right', 'Info');
    info.type = 'button';
    info.setAttribute('aria-expanded', 'false');
    info.setAttribute('aria-controls', veilId);
    info.addEventListener('click', () => {
      const open = !card.classList.contains('is-open');
      closeAll(card);
      card.classList.toggle('is-open', open);
      info.setAttribute('aria-expanded', String(open));
      info.textContent = open ? 'Close' : 'Info';
    });
    media.appendChild(info);

    const veil = el('div', 'veil');
    veil.id = veilId;
    veil.appendChild(el('p', 'veil-title', post.title));
    if (post.summary) veil.appendChild(el('p', 'veil-text', post.summary));
    veil.appendChild(el('span', 'veil-go', 'Read on Substack'));
    media.appendChild(veil);

    card.appendChild(media);

    const time = el('time', 'meta', formatDate(post.date));
    time.dateTime = post.date;
    card.appendChild(caption(post.title, post.url, [time, el('span', 'meta', post.author || 'Ecologies of Care')]));
    return card;
  }

  function archiveCard() {
    const card = el('article', 'card');
    const media = el('div', 'media');
    media.appendChild(el('span', 'label label--left', 'Substack'));
    const text = el('span', 'media-text');
    text.append(el('b', null, 'ecologies of care'), ' on Substack');
    media.appendChild(text);
    card.appendChild(media);
    card.appendChild(caption('All posts', ARCHIVE_URL, [
      el('span', 'meta', 'Archive and subscription'),
      el('span', 'meta', 'ecologiesofcare.substack.com'),
    ]));
    return card;
  }

  // Drag to scroll with a mouse. Touch and trackpads scroll natively.
  let drag = null;
  let dragged = false;
  strip.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('button')) return;
    drag = { x: e.clientX, left: strip.scrollLeft, id: e.pointerId };
    dragged = false;
  });
  strip.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    if (!dragged && Math.abs(dx) > 4) {
      dragged = true;
      strip.classList.add('is-dragging');
      try { strip.setPointerCapture(drag.id); } catch (_) {}
    }
    if (dragged) strip.scrollLeft = drag.left - dx;
  });
  const endDrag = () => { drag = null; strip.classList.remove('is-dragging'); };
  strip.addEventListener('pointerup', endDrag);
  strip.addEventListener('pointercancel', endDrag);
  strip.addEventListener('click', e => {
    if (!dragged) return;
    e.preventDefault();
    e.stopPropagation();
    dragged = false;
  }, true);
  strip.addEventListener('dragstart', e => e.preventDefault());

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(null); });

  async function loadPosts() {
    if (Array.isArray(window.EOC_POSTS)) return window.EOC_POSTS;
    const res = await fetch('posts.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(`posts.json: HTTP ${res.status}`);
    const data = await res.json();
    return Array.isArray(data.posts) ? data.posts : [];
  }

  loadPosts()
    .then(posts => {
      const valid = posts.filter(p => p && p.title && isHttps(p.url)).slice(0, MAX_CARDS);
      if (!valid.length) return;
      valid.forEach((post, i) => strip.appendChild(postCard(post, i)));
      strip.appendChild(archiveCard());
      strip.hidden = false;
    })
    .catch(err => console.warn('Substack strip:', err.message));   // the homepage shows nothing rather than a broken box
})();
</script>
</body>
</html>
